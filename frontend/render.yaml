services:
  type: web
  name: logshield-frontend
  env: node
  plan: free
  buildCommand: "cd frontend && npm run build"
  staticPublishPath: ./frontend/dist
  envVars:
    - key: VITE_API_BASE_URL
      value: https://log-shield-hjpg.onrender.com
  headers:
    - path: /*
      name: Content-Security-Policy
      value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://log-shield-hjpg.onrender.com https://logshield-frontend.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    - path: /*
      name: X-Frame-Options
      value: DENY
    - path: /*
      name: Referrer-Policy
      value: strict-origin-when-cross-origin
    - path: /*
      name: X-Content-Type-Options
      value: nosniff
    - path: /*
      name: Permissions-Policy
      value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    - path: /*
      name: Cross-Origin-Resource-Policy
      value: same-origin
    - path: /*
      name: Cross-Origin-Opener-Policy
      value: same-origin
  routes:
    - type: rewrite
      source: /*
      destination: /index.html
